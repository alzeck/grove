[package]
name = "grove-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Dev aid: `GROVE_DEBUG_SHOTS=<dir>` renders the main window in a few states
# to PNGs and quits (see src/gui/debug_shots.rs). Not for release builds.
debug-screenshots = ["gpui-kit/test-support", "dep:image"]

[[bin]]
name = "grove"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
bytes.workspace = true
clap = { workspace = true, features = ["env"] }
futures.workspace = true
gpui-kit.workspace = true
grove-config.workspace = true
grove-core.workspace = true
grove-git.workspace = true
grove-github.workspace = true
grove-ipc.workspace = true
grove-proc.workspace = true
grove-proxy.workspace = true
grove-term.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = "0.25"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSApplication", "NSResponder", "NSRunningApplication", "NSView", "NSGraphics", "NSGlassEffectView", "NSColor", "NSWindow", "NSImage"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSGeometry", "NSData"] }
raw-window-handle = "0.6"
